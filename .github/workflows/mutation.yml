name: Mutation testing

# Too slow for every push, so weekly, on demand, and on pull requests that
# change how it runs. The report shows each mutant the tests didn't notice.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - stryker.config.mjs
      - .github/workflows/mutation.yml

permissions:
  contents: read

# A newer push makes an unfinished run on the same branch pointless.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Stryker on src/lib
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails if the mutation score drops below the break threshold in stryker.config.mjs.
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
