version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all minor and patch updates, so they don't pile up.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node type definitions follow the Node version the app runs on (.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-config-next still bundles eslint-plugin-react, -jsx-a11y
      # and -import, which declare ESLint <=9, so `npm ci` fails on the peer
      # conflict. Their rules do run under 10; lift this once Next's config does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
